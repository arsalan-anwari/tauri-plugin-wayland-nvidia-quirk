[package]
name = "wayland-nvidia-quirk-demo"
version = "0.0.0"
edition = "2021"
publish = false
description = "Demo app for tauri-plugin-wayland-nvidia-quirk; not part of the published crate"
license = "Apache-2.0"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-wayland-nvidia-quirk = { path = "../.." }
serde = { version = "1", features = ["derive"] }
